<text x="44" y="2104" font-size="12.5" fill="#475569">· 买手系统/集运客户端系统：买手入驻平台，承接购物系统订单完成采购付款，工厂将商品快递至国内仓并生成国内收货单。</text>
<text x="44" y="2124" font-size="12.5" fill="#475569">· 集运系统：依据订单信息与国内收货单，仓库收货后区分商品所属购物订单及对应买手收货单（线下扫码、拆包、分拣至收货车）。</text>
<text x="44" y="2144" font-size="12.5" fill="#475569">· 云仓可视化：上架入库后，美国 C 端客户可在购物系统按购物订单查询个人云仓（商品名称·数量·照片·所在库位）；买手可在买手系统/集运客户端系统按国内收货单查询个人云仓。</text>
<text x="44" y="2164" font-size="12.5" fill="#475569">· 国际运单：美国 C 端客户（或买手/集运客户）可分别经购物系统 / 买手系统/集运客户端系统选择云仓商品生成国际运单并支付运费 → 集运系统出库（拣货·打包·称重）→ 集运系统向对应系统提供轨迹跟踪接口 → 用户在对应系统实时跟踪轨迹。</text>
